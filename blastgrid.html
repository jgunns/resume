<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blast Grid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#14161f;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-columns:minmax(210px,21vw) 1fr minmax(210px,21vw);grid-template-areas:"pad game bomb"}
#game{grid-area:game;display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px}
#hud{display:flex;gap:10px;justify-content:center;align-items:center;font-weight:700;font-size:17px;padding:4px 0 10px;flex-wrap:wrap}
.chip{background:#252a3a;border-radius:10px;padding:6px 12px;white-space:nowrap}
.ibtn{background:#252a3a;border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:17px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
canvas{border-radius:10px;box-shadow:0 8px 30px #0009;display:block}
#padWrap{grid-area:pad;display:flex;align-items:center;justify-content:center}
#bombWrap{grid-area:bomb;display:flex;align-items:center;justify-content:center}
#pad{width:200px;height:200px;border-radius:50%;background:#232838;position:relative;box-shadow:inset 0 0 0 3px #343b52}
#pad .ar{position:absolute;width:0;height:0;border:14px solid transparent;opacity:.5}
#pad .u{left:86px;top:10px;border-bottom:18px solid #9aa6cc;border-top:0}
#pad .d{left:86px;bottom:10px;border-top:18px solid #9aa6cc;border-bottom:0}
#pad .l{top:86px;left:10px;border-right:18px solid #9aa6cc;border-left:0}
#pad .r{top:86px;right:10px;border-left:18px solid #9aa6cc;border-right:0}
#knob{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#4a5577;box-shadow:0 5px 0 #2d3550;transition:transform .05s}
#bombBtn{width:160px;height:160px;border-radius:50%;background:#e2483d;box-shadow:0 9px 0 #9c2a22;font-size:62px;display:flex;align-items:center;justify-content:center}
#bombBtn.down{transform:translateY(7px);box-shadow:0 2px 0 #9c2a22}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;background:#000b;border-radius:10px;padding:20px}
#overlay h1{font-size:54px;letter-spacing:2px;color:#ffcc33;text-shadow:0 4px 0 #b34}
#overlay p{font-size:19px;line-height:1.5;color:#dde;max-width:520px}
button.big{font-size:26px;font-weight:800;padding:16px 40px;border-radius:16px;border:0;background:#ffcc33;color:#222;box-shadow:0 6px 0 #b8901a}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901a}
.hidden{display:none!important}
@media (orientation:portrait){
 #app{grid-template-columns:1fr 1fr;grid-template-rows:1fr 290px;grid-template-areas:"game game" "pad bomb"}
}
</style>
</head>
<body>
<div id="app">
 <div id="padWrap"><div id="pad"><div class="ar u"></div><div class="ar d"></div><div class="ar l"></div><div class="ar r"></div><div id="knob"></div></div></div>
 <div id="game">
  <div id="hud">
   <span class="chip" id="hStage">Stage 1</span>
   <span class="chip" id="hScore">0</span>
   <span class="chip" id="hLives">❤️ 3</span>
   <span class="chip" id="hStats">💣1 🔥2 👟1</span>
   <button class="ibtn" id="muteBtn">🔊</button>
   <button class="ibtn" id="pauseBtn">⏸</button>
  </div>
  <div id="stage">
   <canvas id="cv"></canvas>
   <div id="overlay">
    <h1 id="oTitle">BLAST GRID</h1>
    <p id="oText"></p>
    <button class="big" id="oBtn">Play</button>
   </div>
  </div>
 </div>
 <div id="bombWrap"><div id="bombBtn">💣</div></div>
</div>
<script>
(() => {
const COLS=15, ROWS=13, TS=48;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
cv.width=COLS*TS*DPR; cv.height=ROWS*TS*DPR; ctx.scale(DPR,DPR);
const stageEl=document.getElementById('stage');

function resize(){
  const r=stageEl.getBoundingClientRect();
  const s=Math.min(r.width/(COLS*TS), r.height/(ROWS*TS));
  cv.style.width=Math.floor(COLS*TS*s)+'px';
  cv.style.height=Math.floor(ROWS*TS*s)+'px';
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));

// ---------- storage ----------
let best=0;
try{ best=+localStorage.getItem('blastgrid-best')||0 }catch(e){}
function saveBest(){ if(score>best){best=score; try{localStorage.setItem('blastgrid-best',best)}catch(e){}} }

// ---------- audio ----------
let ac=null, muted=false, noiseBuf=null;
function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)() }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume().catch(()=>{});
}
function tone(f,d,type='square',v=0.07,slide=0){
  if(!ac||muted) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d);
}
function boom(){
  if(!ac||muted) return;
  if(!noiseBuf){
    const len=ac.sampleRate*0.6|0; noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  }
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=800;
  const g=ac.createGain(); g.gain.value=0.6;
  s.connect(f).connect(g).connect(ac.destination); s.start();
  tone(90,0.35,'sine',0.25,40);
}

// ---------- game state ----------
let state='title', level=1, score=0, lives=3;
let grid, bombs, fires, enemies, items, popups, player;
let stats, deadTimer=0, shake=0, time=0, exitAnnounced=false;
const key=(x,y)=>y*COLS+x;

function resetStats(){ stats={bombs:1, range:2, speed:3.4, spd:1}; }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; }

function buildLevel(){
  grid=[];
  for(let y=0;y<ROWS;y++){
    const row=[];
    for(let x=0;x<COLS;x++){
      const border=x===0||y===0||x===COLS-1||y===ROWS-1;
      row.push(border||(x%2===0&&y%2===0)?1:0);
    }
    grid.push(row);
  }
  const safe=new Set([key(1,1),key(2,1),key(1,2),key(3,1),key(1,3)]);
  const brickChance=Math.min(0.40+level*0.015,0.55);
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++)
    if(grid[y][x]===0 && !safe.has(key(x,y)) && Math.random()<brickChance) grid[y][x]=2;

  // enemies
  enemies=[];
  const spots=[];
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++)
    if(grid[y][x]!==1 && x+y>7) spots.push([x,y]);
  shuffle(spots);
  const n=Math.min(3+level,11);
  for(let i=0;i<n && i<spots.length;i++){
    const [x,y]=spots[i]; grid[y][x]=0;
    const fast=level>=2 && Math.random()<Math.min(0.15+level*0.08,0.6);
    enemies.push({x,y,tx:x,ty:y,dir:[0,0],type:fast?'fast':'slime',
      speed:fast?Math.min(2.3+level*0.1,3.6):Math.min(1.3+level*0.08,2.4),ph:Math.random()*6});
  }

  // items under bricks
  items=new Map();
  const bricks=[];
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++) if(grid[y][x]===2) bricks.push([x,y]);
  shuffle(bricks);
  if(bricks.length){ const [ex,ey]=bricks.pop(); items.set(key(ex,ey),{type:'exit',x:ex,y:ey,revealed:false}); }
  const types=['bomb','fire','speed'];
  const pu=3+Math.floor(level/2);
  for(let i=0;i<pu && bricks.length;i++){
    const [px,py]=bricks.pop();
    items.set(key(px,py),{type:types[i%3===0?0:(Math.random()*3|0)],x:px,y:py,revealed:false});
  }

  bombs=[]; fires=[]; popups=[];
  player={x:1,y:1,dir:[0,1],alive:true,walk:0};
  exitAnnounced=false; shake=0;
}

// ---------- helpers ----------
const bombAt=(x,y)=>bombs.find(b=>b.x===x&&b.y===y);
const fireAt=(x,y)=>fires.some(f=>f.x===x&&f.y===y);
function playerFree(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS||grid[y][x]!==0) return false;
  const b=bombAt(x,y); return !b||b.ownerInside;
}
function enemyFree(x,y){
  return x>=0&&y>=0&&x<COLS&&y<ROWS&&grid[y][x]===0&&!bombAt(x,y);
}
function popup(x,y,text,color='#fff'){ popups.push({x,y,text,color,t:1.1}); }

function moveToward(v,target,step){ return Math.abs(target-v)<=step?target:v+Math.sign(target-v)*step; }

function tryMove(e,dx,dy,dist){
  if(dx!==0){
    const cx=Math.round(e.x), ry=Math.round(e.y);
    if(Math.abs(e.y-ry)>0.001){
      if(playerFree(cx+dx,ry)){ e.y=moveToward(e.y,ry,dist); return; }
      const ry2=e.y>ry?ry+1:ry-1;
      if(playerFree(cx+dx,ry2)) e.y=moveToward(e.y,ry2,dist);
      return;
    }
    e.y=ry;
    let nx=e.x+dx*dist;
    if(!playerFree(cx+dx,ry)) nx = dx>0 ? Math.min(nx,Math.max(e.x,cx)) : Math.max(nx,Math.min(e.x,cx));
    e.x=nx;
  } else if(dy!==0){
    const cy=Math.round(e.y), rx=Math.round(e.x);
    if(Math.abs(e.x-rx)>0.001){
      if(playerFree(rx,cy+dy)){ e.x=moveToward(e.x,rx,dist); return; }
      const rx2=e.x>rx?rx+1:rx-1;
      if(playerFree(rx2,cy+dy)) e.x=moveToward(e.x,rx2,dist);
      return;
    }
    e.x=rx;
    let ny=e.y+dy*dist;
    if(!playerFree(rx,cy+dy)) ny = dy>0 ? Math.min(ny,Math.max(e.y,cy)) : Math.max(ny,Math.min(e.y,cy));
    e.y=ny;
  }
}

function addFire(x,y,brick=false){
  const f=fires.find(f=>f.x===x&&f.y===y);
  if(f){ f.t=0.55; return; }
  fires.push({x,y,t:0.55,brick});
}

function explode(b){
  boom(); shake=0.25;
  addFire(b.x,b.y);
  for(const [dx,dy] of DIRS){
    for(let i=1;i<=b.range;i++){
      const x=b.x+dx*i, y=b.y+dy*i;
      if(grid[y][x]===1) break;
      const ob=bombAt(x,y);
      if(ob){ ob.t=0; addFire(x,y); break; }
      if(grid[y][x]===2){
        grid[y][x]=0; addFire(x,y,true);
        const it=items.get(key(x,y)); if(it) it.revealed=true;
        break;
      }
      addFire(x,y);
    }
  }
}

function chooseDir(e){
  const opts=DIRS.filter(d=>enemyFree(e.tx+d[0],e.ty+d[1]));
  if(!opts.length){ e.dir=[0,0]; return; }
  if(e.type==='fast' && Math.random()<0.55 && player.alive){
    opts.sort((a,b)=>Math.hypot(e.tx+a[0]-player.x,e.ty+a[1]-player.y)-Math.hypot(e.tx+b[0]-player.x,e.ty+b[1]-player.y));
    e.dir=opts[0]; return;
  }
  const keep=opts.find(d=>d[0]===e.dir[0]&&d[1]===e.dir[1]);
  if(keep && Math.random()<0.75){ e.dir=keep; return; }
  const noRev=opts.filter(d=>!(d[0]===-e.dir[0]&&d[1]===-e.dir[1]));
  const pool=noRev.length?noRev:opts;
  e.dir=pool[Math.random()*pool.length|0];
}

// ---------- input ----------
const held=[]; // keyboard dir stack
let padDir=[0,0], bombQueued=false;
const KEYS={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
addEventListener('keydown',e=>{
  if(KEYS[e.code]){ e.preventDefault(); if(!held.includes(e.code)) held.push(e.code); }
  else if(e.code==='Space'||e.code==='KeyX'||e.code==='Enter'){
    e.preventDefault();
    if(state==='play') bombQueued=true;
    else if(!overlay.classList.contains('hidden')) oBtn.click();
  }
  else if(e.code==='KeyP'||e.code==='Escape') togglePause();
});
addEventListener('keyup',e=>{ const i=held.indexOf(e.code); if(i>=0) held.splice(i,1); });
function inputDir(){
  if(held.length) return KEYS[held[held.length-1]];
  return padDir;
}

const pad=document.getElementById('pad'), knob=document.getElementById('knob');
let padId=null;
function padUpdate(e){
  const r=pad.getBoundingClientRect();
  let vx=e.clientX-(r.left+r.width/2), vy=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(vx,vy), max=r.width*0.3;
  const k=len>max?max/len:1;
  knob.style.transform=`translate(${vx*k}px,${vy*k}px)`;
  if(len<r.width*0.1) padDir=[0,0];
  else if(Math.abs(vx)>Math.abs(vy)) padDir=[Math.sign(vx),0];
  else padDir=[0,Math.sign(vy)];
}
pad.addEventListener('pointerdown',e=>{ e.preventDefault(); audio(); padId=e.pointerId; try{pad.setPointerCapture(e.pointerId)}catch(_){} padUpdate(e); });
pad.addEventListener('pointermove',e=>{ if(e.pointerId===padId) padUpdate(e); });
const padEnd=e=>{ if(e.pointerId===padId){ padId=null; padDir=[0,0]; knob.style.transform=''; } };
pad.addEventListener('pointerup',padEnd); pad.addEventListener('pointercancel',padEnd);

const bombBtn=document.getElementById('bombBtn');
bombBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); audio(); bombBtn.classList.add('down'); if(state==='play') bombQueued=true; });
['pointerup','pointercancel','pointerleave'].forEach(t=>bombBtn.addEventListener(t,()=>bombBtn.classList.remove('down')));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// ---------- overlay / flow ----------
const overlay=document.getElementById('overlay'), oTitle=document.getElementById('oTitle'),
      oText=document.getElementById('oText'), oBtn=document.getElementById('oBtn');
let oAction=null;
function showOverlay(title,text,btn,action){
  oTitle.textContent=title; oText.innerHTML=text; oBtn.textContent=btn; oAction=action;
  overlay.classList.remove('hidden');
}
oBtn.addEventListener('click',()=>{ audio(); overlay.classList.add('hidden'); const a=oAction; oAction=null; a&&a(); });

function newGame(){ level=1; score=0; lives=3; resetStats(); buildLevel(); state='play'; tone(523,0.1); setTimeout(()=>tone(784,0.15),110); }
function nextStage(){ level++; buildLevel(); state='play'; }
function togglePause(){
  if(state==='play'){ state='paused'; showOverlay('Paused','','Resume',()=>{state='play'}); }
  else if(state==='paused'){ overlay.classList.add('hidden'); state='play'; }
}
document.getElementById('pauseBtn').addEventListener('click',togglePause);
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{ audio(); muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play') togglePause(); });

function killPlayer(){
  if(!player.alive) return;
  player.alive=false; state='dying'; deadTimer=1.6;
  tone(440,0.8,'sawtooth',0.08,60);
}

// ---------- update ----------
function update(dt){
  time+=dt;
  if(shake>0) shake=Math.max(0,shake-dt);
  for(const p of popups) p.t-=dt;
  popups=popups.filter(p=>p.t>0);
  if(state!=='play' && state!=='dying') return;

  // fires
  for(const f of fires) f.t-=dt;
  fires=fires.filter(f=>f.t>0);

  // bombs
  for(const b of bombs){
    b.t-=dt;
    if(b.ownerInside && (Math.abs(player.x-b.x)>=0.95||Math.abs(player.y-b.y)>=0.95)) b.ownerInside=false;
  }
  let again=true;
  while(again){
    again=false;
    for(let i=0;i<bombs.length;i++) if(bombs[i].t<=0){ explode(bombs.splice(i,1)[0]); again=true; break; }
  }

  // enemies
  for(const e of enemies){
    e.ph+=dt*6;
    if(e.x===e.tx&&e.y===e.ty){
      chooseDir(e);
      e.tx+=e.dir[0]; e.ty+=e.dir[1];
    } else if(!enemyFree(e.tx,e.ty)){
      e.tx-=e.dir[0]; e.ty-=e.dir[1]; e.dir=[-e.dir[0],-e.dir[1]];
    }
    const step=e.speed*dt;
    e.x=moveToward(e.x,e.tx,step); e.y=moveToward(e.y,e.ty,step);
  }
  const before=enemies.length;
  enemies=enemies.filter(e=>{
    if(fireAt(Math.round(e.x),Math.round(e.y))){
      const pts=e.type==='fast'?200:100; score+=pts;
      popup(e.x,e.y,'+'+pts,'#ffe066'); tone(880,0.12,'square',0.06,220);
      return false;
    }
    return true;
  });
  if(before>0 && enemies.length===0 && !exitAnnounced){
    exitAnnounced=true; popup(player.x,player.y-0.4,'Find the exit! 🚪','#7cf');
    tone(660,0.1); setTimeout(()=>tone(990,0.18),120);
  }

  if(state==='dying'){
    deadTimer-=dt;
    if(deadTimer<=0){
      lives--;
      if(lives<=0){
        state='over'; saveBest();
        showOverlay('Game Over',`Score: <b>${score}</b><br>Best: <b>${best}</b><br>You reached stage ${level}.`,'Play Again',newGame);
      } else { buildLevel(); state='play'; }
    }
    return;
  }

  // player movement
  const [dx,dy]=inputDir();
  if(dx||dy){
    player.dir=[dx,dy]; player.walk+=dt*10;
    tryMove(player,dx,dy,stats.speed*dt);
  }

  // place bomb
  if(bombQueued){
    bombQueued=false;
    const bx=Math.round(player.x), by=Math.round(player.y);
    if(bombs.length<stats.bombs && !bombAt(bx,by) && grid[by][bx]===0){
      bombs.push({x:bx,y:by,t:2.4,range:stats.range,ownerInside:true});
      tone(180,0.08,'triangle',0.15);
    }
  }

  const px=Math.round(player.x), py=Math.round(player.y);
  // pickups
  const it=items.get(key(px,py));
  if(it && it.revealed){
    if(it.type==='exit'){
      if(enemies.length===0 && Math.abs(player.x-px)<0.3 && Math.abs(player.y-py)<0.3){
        score+=500+level*100; saveBest(); state='clear';
        [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.15),i*110));
        showOverlay(`Stage ${level} Clear!`,`Score: <b>${score}</b>`,'Next Stage',nextStage);
      }
    } else {
      items.delete(key(px,py));
      if(it.type==='bomb'){ stats.bombs=Math.min(stats.bombs+1,8); popup(px,py,'+1 Bomb','#fff'); }
      if(it.type==='fire'){ stats.range=Math.min(stats.range+1,8); popup(px,py,'+1 Range','#ffa94d'); }
      if(it.type==='speed'){ stats.spd=Math.min(stats.spd+1,5); stats.speed=3.4+(stats.spd-1)*0.55; popup(px,py,'Speed Up','#8ce99a'); }
      score+=50; tone(700,0.08); setTimeout(()=>tone(1100,0.1),70);
    }
  }

  // deaths
  if(fireAt(px,py)) killPlayer();
  for(const e of enemies) if(Math.abs(e.x-player.x)<0.62 && Math.abs(e.y-player.y)<0.62) killPlayer();
}

// ---------- draw ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); }

function drawTiles(){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const px=x*TS, py=y*TS, t=grid[y][x];
    if(t===1){
      ctx.fillStyle='#4b5068'; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle='#727896'; ctx.fillRect(px+3,py+3,TS-6,TS-12);
      ctx.fillStyle='#8a90ae'; ctx.fillRect(px+3,py+3,TS-6,5);
    } else {
      ctx.fillStyle=(x+y)%2?'#2f6d3b':'#2b6536'; ctx.fillRect(px,py,TS,TS);
      if(t===2){
        ctx.fillStyle='#b8622e'; ctx.fillRect(px+1,py+1,TS-2,TS-2);
        ctx.fillStyle='#8a4520';
        const h=TS/3;
        for(let r=1;r<3;r++) ctx.fillRect(px+1,py+r*h-1,TS-2,2);
        for(let r=0;r<3;r++){
          const off=r%2?TS/4:TS*3/4;
          ctx.fillRect(px+off-1,py+r*h+1,2,h-2);
          if(r%2===0) ctx.fillRect(px+TS/4-1,py+r*h+1,2,h-2);
        }
        ctx.fillStyle='#d27a40'; ctx.fillRect(px+1,py+1,TS-2,3);
      }
    }
  }
}

function drawItems(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const it of items.values()){
    if(!it.revealed) continue;
    const px=it.x*TS, py=it.y*TS;
    if(it.type==='exit'){
      const open=enemies.length===0;
      ctx.fillStyle=open?'#3fd0ff':'#334';
      rr(px+5,py+5,TS-10,TS-10,8); ctx.fill();
      if(open){ ctx.globalAlpha=0.4+0.3*Math.sin(time*6); ctx.fillStyle='#fff'; rr(px+5,py+5,TS-10,TS-10,8); ctx.fill(); ctx.globalAlpha=1; }
      ctx.font=`${TS*0.6}px sans-serif`; ctx.fillText('🚪',px+TS/2,py+TS/2+2);
    } else {
      const bob=Math.sin(time*5+it.x)*2;
      ctx.fillStyle='#ffffffcc'; rr(px+6,py+6+bob,TS-12,TS-12,9); ctx.fill();
      ctx.font=`${TS*0.5}px sans-serif`;
      ctx.fillText({bomb:'💣',fire:'🔥',speed:'👟'}[it.type],px+TS/2,py+TS/2+bob+2);
    }
  }
}

function drawBombs(){
  for(const b of bombs){
    const cx=b.x*TS+TS/2, cy=b.y*TS+TS/2;
    const fast=b.t<0.8, s=1+0.08*Math.sin(time*(fast?30:12));
    const r=TS*0.33*s;
    ctx.fillStyle='#0006'; ctx.beginPath(); ctx.ellipse(cx,cy+r*0.9,r*0.9,r*0.3,0,0,7); ctx.fill();
    ctx.fillStyle=fast&&Math.sin(time*30)>0?'#5a1010':'#15151c';
    ctx.beginPath(); ctx.arc(cx,cy+2,r,0,7); ctx.fill();
    ctx.fillStyle='#ffffff55'; ctx.beginPath(); ctx.arc(cx-r*0.35,cy-r*0.3,r*0.25,0,7); ctx.fill();
    ctx.strokeStyle='#c9a46b'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx+r*0.4,cy-r*0.7); ctx.quadraticCurveTo(cx+r*0.9,cy-r*1.3,cx+r*0.6,cy-r*1.5); ctx.stroke();
    ctx.fillStyle=Math.random()<0.5?'#ffdd33':'#ff7722';
    ctx.beginPath(); ctx.arc(cx+r*0.6,cy-r*1.5,3+Math.random()*3,0,7); ctx.fill();
  }
}

function drawFires(){
  for(const f of fires){
    const px=f.x*TS, py=f.y*TS, a=Math.min(1,f.t/0.2);
    ctx.globalAlpha=a;
    if(f.brick){ ctx.fillStyle='#5a2a10'; ctx.fillRect(px+2,py+2,TS-4,TS-4); }
    ctx.fillStyle='#ff6a00'; rr(px+2,py+2,TS-4,TS-4,10); ctx.fill();
    ctx.fillStyle='#ffb000'; rr(px+9,py+9,TS-18,TS-18,8); ctx.fill();
    ctx.fillStyle='#fff3b0'; ctx.beginPath(); ctx.arc(px+TS/2,py+TS/2,TS*0.14+Math.random()*3,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawEnemy(e){
  const cx=e.x*TS+TS/2, cy=e.y*TS+TS/2, bounce=Math.abs(Math.sin(e.ph))*4;
  ctx.fillStyle='#0005'; ctx.beginPath(); ctx.ellipse(cx,cy+TS*0.32,TS*0.3,TS*0.1,0,0,7); ctx.fill();
  if(e.type==='slime'){
    ctx.fillStyle='#9b5de5';
    ctx.beginPath(); ctx.ellipse(cx,cy+4-bounce/2,TS*0.34+bounce/3,TS*0.3-bounce/4,0,0,7); ctx.fill();
    ctx.fillStyle='#c39bff'; ctx.beginPath(); ctx.ellipse(cx-6,cy-4-bounce/2,6,4,0,0,7); ctx.fill();
  } else {
    ctx.fillStyle='#e03131';
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const a=i/16*Math.PI*2+e.ph*0.3, r=i%2?TS*0.36:TS*0.26;
      ctx.lineTo(cx+Math.cos(a)*r, cy-bounce/2+Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
  }
  const ey=cy-2-bounce/2, lx=e.dir[0]*2, ly=e.dir[1]*2;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx-7,ey,5,0,7); ctx.arc(cx+7,ey,5,0,7); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(cx-7+lx,ey+ly,2.5,0,7); ctx.arc(cx+7+lx,ey+ly,2.5,0,7); ctx.fill();
}

function drawPlayer(){
  const p=player;
  if(!p.alive && Math.floor(time*12)%2) return;
  const cx=p.x*TS+TS/2, cy=p.y*TS+TS/2;
  const bob=Math.abs(Math.sin(p.walk))*3;
  const s=p.alive?1:Math.max(0.2,deadTimer/1.6);
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  if(!p.alive) ctx.rotate(time*10);
  ctx.fillStyle='#0005'; ctx.beginPath(); ctx.ellipse(0,TS*0.33,TS*0.28,TS*0.1,0,0,7); ctx.fill();
  // antenna
  ctx.strokeStyle='#cfd8ff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-TS*0.3-bob); ctx.lineTo(0,-TS*0.44-bob); ctx.stroke();
  ctx.fillStyle='#ffcc33'; ctx.beginPath(); ctx.arc(0,-TS*0.46-bob,4.5,0,7); ctx.fill();
  // body
  ctx.fillStyle='#3b82f6'; ctx.beginPath(); ctx.arc(0,-bob,TS*0.34,0,7); ctx.fill();
  ctx.fillStyle='#60a5fa'; ctx.beginPath(); ctx.arc(-5,-6-bob,TS*0.2,0,7); ctx.fill();
  // visor
  const vx=p.dir[0]*4, vy=p.dir[1]*3;
  ctx.fillStyle='#10172a'; rr(-13+vx,-8-bob+vy,26,13,6); ctx.fill();
  ctx.fillStyle='#5ef1ff';
  ctx.fillRect(-8+vx,-4-bob+vy,5,5); ctx.fillRect(3+vx,-4-bob+vy,5,5);
  // feet
  ctx.fillStyle='#1e3a8a';
  const st=Math.sin(p.walk)*3;
  ctx.beginPath(); ctx.ellipse(-8,TS*0.3+st,6,4,0,0,7); ctx.ellipse(8,TS*0.3-st,6,4,0,0,7); ctx.fill();
  ctx.restore();
}

function drawPopups(){
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 18px -apple-system,sans-serif';
  for(const p of popups){
    const y=p.y*TS+TS/2-(1.1-p.t)*30;
    ctx.globalAlpha=Math.min(1,p.t*2);
    ctx.lineWidth=4; ctx.strokeStyle='#000a'; ctx.strokeText(p.text,p.x*TS+TS/2,y);
    ctx.fillStyle=p.color; ctx.fillText(p.text,p.x*TS+TS/2,y);
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.save();
  ctx.clearRect(0,0,COLS*TS,ROWS*TS);
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*24,(Math.random()-0.5)*shake*24);
  if(grid){
    drawTiles(); drawItems(); drawFires(); drawBombs();
    for(const e of enemies) drawEnemy(e);
    drawPlayer(); drawPopups();
  } else {
    ctx.fillStyle='#2b6536'; ctx.fillRect(0,0,COLS*TS,ROWS*TS);
  }
  ctx.restore();
}

// ---------- HUD ----------
const hStage=document.getElementById('hStage'), hScore=document.getElementById('hScore'),
      hLives=document.getElementById('hLives'), hStats=document.getElementById('hStats');
let lastHud='';
function hud(){
  const s=`${level}|${score}|${lives}|${stats.bombs}|${stats.range}|${stats.spd}`;
  if(s===lastHud) return; lastHud=s;
  hStage.textContent='Stage '+level;
  hScore.textContent='⭐ '+score;
  hLives.textContent='❤️ '+Math.max(lives,0);
  hStats.textContent=`💣${stats.bombs} 🔥${stats.range} 👟${stats.spd}`;
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  update(dt); draw(); hud();
  requestAnimationFrame(frame);
}
resetStats(); buildLevel(); resize(); setTimeout(resize,100);
showOverlay('BLAST GRID',
  `Drop bombs to blast bricks and enemies.<br>Clear every enemy, then find the hidden 🚪 exit.<br><br>
   🕹 Left pad: move &nbsp; 💣 Right button: drop bomb<br>
   Power-ups: 💣 more bombs · 🔥 bigger blasts · 👟 speed<br>
   Keyboard: arrows/WASD + Space` + (best?`<br><br>Best: <b>${best}</b>`:''),
  'Play', newGame);
requestAnimationFrame(frame);
})();
</script>
